[package]
name = "mtop"
version = "0.1.0"
edition = "2021"

[dependencies]
color-eyre = "*"
#rstest = "*"
const_panic = "0.2.12"

rayon = "*"
tokio = {version = "1.43.0", features = ["full"]}
tokio-macros = "*"

once_cell = "1.20.3"
num-traits = "*"
serde = {version = "1.0.218", features = ["derive"]}
serde_json = "1.0.140"
home = "0.5.11"
curl = "0.4.47"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = {level = "deny", priority = 0}
pedantic = {level = "deny", priority = -1}
nursery = {level = "deny", priority = -1}
unwrap_used = {level = "deny", priority = 0}

[profile.release]
opt-level = 0
lto = true
codegen-units = 1
panic = "abort"
stip = "symbols"